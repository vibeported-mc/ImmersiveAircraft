buildscript {
    configurations.classpath {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }
}

plugins {
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id "dev.architectury.loom" version "1.17-SNAPSHOT" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }

    repositories {
        maven { url "https://maven.parchmentmc.org" }
        maven { url "https://maven.terraformersmc.com/releases/" }
        maven { url "https://dvs1.progwml6.com/files/maven/" }
        maven { url "https://maven.blamejared.com" }
        maven { url "https://maven.shedaniel.me/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://nexus.resourcefulbees.com/repository/maven-public/" }
        maven { url "https://maven.teamresourceful.com/repository/maven-public/" }
        maven { url "https://cursemaven.com" }
        maven { url "https://maven.conczin.net/Artifacts" }
        maven {
            url "https://api.modrinth.com/maven"
            content { includeGroup "maven.modrinth" }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.architectury.minecraft}"
        // Minecraft 26.1+ ships unobfuscated with Mojang's official names baked in,
        // so there is no obfuscation map to apply anymore (see fabric.loom.disableObfuscation in gradle.properties).
    }
}


def getAppVersion = { ->
    // Release builds are driven by a tag and pass it in explicitly, so the jars and the
    // Maven coordinates carry the exact tag rather than whatever git happens to report.
    // See .github/workflows/vibeported.yml.
    def explicit = System.getenv("MOD_VERSION")
    if (explicit != null && !explicit.trim().isEmpty()) {
        return explicit.trim()
    }
    try {
        // Gradle 9 removed Project.exec(); providers.exec is the supported replacement.
        def tag = providers.exec {
            commandLine 'git', 'tag', '--points-at', 'HEAD'
        }.standardOutput.asText.get().trim()
        if (tag.isEmpty()) {
            return rootProject.minecraft_version + "-SNAPSHOT"
        }
        // A commit can carry several tags; the first one wins.
        return tag.split('\\R')[0].trim()
    } catch (Exception e) {
        println "Warning: ${e.message}, is git installed?"
        return rootProject.minecraft_version + "-DEV"
    }
} as Object


allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base.archivesName = rootProject.archives_base_name
    version = getAppVersion()

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 25
    }

    java {
        withSourcesJar()
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    publishing {
        repositories {
            // Upstream published to maven.conczin.net; this fork must never write there.
            // GitHub Packages is scoped to this repository and authenticates with the
            // workflow's own GITHUB_TOKEN, so there are no long-lived credentials to hold.
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/" +
                        (System.getenv("GITHUB_REPOSITORY") ?: "vibeported-mc/ImmersiveAircraft"))
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }

    // Define reusable exclusion patterns
    def exclusionPatterns = ['**/*.aup3', '**/.xdp-*', '**/*.kra', '**/*~*']
    processResources {
        exclusionPatterns.each {
            pattern -> exclude pattern
        }
    }
    sourcesJar {
        exclusionPatterns.each {
            pattern -> exclude pattern
        }
    }
}