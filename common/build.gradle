architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/immersive_aircraft.accessWidener")
}

dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations
    // Do NOT use other classes from fabric loader
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    // Cloth Config and Mod Menu expose Fabric API types in their signatures, so it has to be on the compile classpath.
    compileOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    implementation 'org.mariuszgromada.math:MathParser.org-mXparser:5.2.1'

    api "com.terraformersmc:modmenu:${mod_menu_version}"

    api("me.shedaniel.cloth:cloth-config-fabric:${cloth_version}") {
        //noinspection GroovyAssignabilityCheck
        exclude(group: "net.fabricmc.fabric-api")
    }

    compileOnlyApi("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")

    compileOnly "me.shedaniel:RoughlyEnoughItems-api:${rei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin:${rei_version}"

    // Inventory Profiles Next, for the optional compatibility mixins in immersive_aircraft.compat.ipn.
    // Compile-only: the mixins are gated behind IPNMixinPlugin and simply never apply when IPN is absent.
    compileOnly "maven.modrinth:inventory-profiles-next:${inventory_profiles_next_version}"

    // compileOnly "earth.terrarium.adastra:ad_astra-common-${ad_astra_version}"
    // runtimeOnly "earth.terrarium.adastra:ad_astra-common-${ad_astra_version}"
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            groupId = rootProject.group_id
            version = version + "+common"
            from components.java
        }
    }
}