plugins {
    id "com.gradleup.shadow" version "9.5.1"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    // Shaded rather than jar-in-jar'd: Loom's JIJ step lived in remapJar, which unobfuscated builds no longer have.
    implementation 'org.mariuszgromada.math:MathParser.org-mXparser:5.2.1'
    shadowCommon 'org.mariuszgromada.math:MathParser.org-mXparser:5.2.1'

    compileOnly("com.terraformersmc:modmenu:${rootProject.mod_menu_version}") { transitive false }

    compileOnlyApi("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")

    runtimeOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:$rei_version"

    // Required to run JEI
    runtimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")

    // Required to run REI
    //runtimeOnly "dev.architectury:architectury-fabric:${rootProject.architectury_version}"
    //runtimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:$rei_version"

    // compileOnly "earth.terrarium.adastra:ad_astra-fabric-${ad_astra_version}"
    // runtimeOnly "earth.terrarium.adastra:ad_astra-fabric-${ad_astra_version}"

    // runtimeOnly "net.conczin:man_of_many_planes:${man_of_many_planes_version}+fabric"
    // runtimeOnly "net.conczin:immersive_machinery:${immersive_machinery}+fabric"

    // Minecraft 26.1+ is unobfuscated, so there's no separate "namedElements" variant anymore;
    // the project's default (api/runtime) variants are already in the official names.
    common(project(":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = ""
}

// Minecraft 26.1+ ships unobfuscated, so Loom no longer remaps jars (no "remapJar" task);
// the shaded jar produced by shadowJar is the final artifact, we just need to inject the access widener into it.
loom.injectAccessWidener(tasks.named("shadowJar"))

tasks.named("assemble") {
    dependsOn tasks.named("shadowJar")
}

// `jar` and `shadowJar` deliberately write the same path: shadowJar replaces the thin jar
// in place, because there is no remapJar left to hand the shaded artifact off to. That makes
// the publication read a file another task produces, which Gradle 9 rejects unless the
// dependency is explicit, so declare it for everything that consumes the published artifact.
tasks.withType(GenerateModuleMetadata).configureEach {
    dependsOn tasks.named("shadowJar")
}
tasks.withType(AbstractPublishToMaven).configureEach {
    dependsOn tasks.named("shadowJar")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            groupId = rootProject.group_id
            // No loader suffix here: release tags already carry `-fabric`, and appending
            // one would double it. Defaults to project.version, i.e. the tag verbatim.
            from components.java
        }
    }
}
